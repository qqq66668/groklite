name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - name: repository hygiene
        run: bash tools/check_no_pii.sh
      - name: format
        run: |
          moon fmt
          git diff --exit-code
      - name: check
        run: moon check --deny-warn
      - name: build
        run: moon build
      - name: test
        run: moon test
      - name: example access log
        run: moon run examples/nginx_to_json
      - name: example syslog
        run: moon run examples/syslog_to_json
      - name: example record pipeline
        run: moon run examples/record_pipeline
      - name: install Node for the js target
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: test on wasm-gc
        run: moon test --target wasm-gc
      - name: test on js
        run: moon test --target js
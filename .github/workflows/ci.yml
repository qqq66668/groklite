name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - name: repository hygiene
        run: bash tools/check_no_pii.sh
      - name: check
        run: moon check --deny-warn
      - name: build
        run: moon build
      - name: test
        run: moon test
      - name: example access log
        run: moon run examples/nginx_to_json
      - name: example syslog
        run: moon run examples/syslog_to_json

  targets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: install Node for the js target
        if: matrix.target == "js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: test on the matrix target
        run: moon test --target ${{ matrix.target }}
